[package]
name = "hap-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A compact, pure-Rust implementation of Illumina hap.py"
license-file = "LICENSE.txt"
repository = "https://github.com/Illumina/hap.py"
homepage = "https://github.com/Illumina/hap.py"
readme = "README.md"
default-run = "hap"
autobins = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE.txt",
    "/README.md",
    "/THIRD_PARTY_LICENSES/**",
    "/rust/src/**",
    "/tests/**",
    "/verification/assets/fixtures/ftx-bam/input.vcf",
    "/verification/assets/fixtures/ftx-bam/reads.bam",
    "/verification/assets/fixtures/ftx-bam/reads.bam.bai",
]

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "hap"
path = "rust/src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
noodles-bgzf = "0.46.0"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
