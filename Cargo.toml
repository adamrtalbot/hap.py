[package]
name = "hap-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A compact, pure-Rust implementation of Illumina hap.py"
license = "BSD-2-Clause"
repository = "https://github.com/adamrtalbot/hap.py"
homepage = "https://github.com/adamrtalbot/hap.py"
documentation = "https://github.com/adamrtalbot/hap.py"
keywords = ["bioinformatics", "benchmarking", "genomics", "vcf"]
categories = ["command-line-utilities", "science"]
readme = "README.md"
default-run = "hap"
autobins = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE.txt",
    "/README.md",
    "/THIRD_PARTY_LICENSES/**",
    "/rust/src/**",
    "/tests/**",
    "/verification/assets/fixtures/external/ebi-vcf-validator/**",
    "/verification/assets/fixtures/ftx-bam/input.vcf",
    "/verification/assets/fixtures/ftx-bam/reads.bam",
    "/verification/assets/fixtures/ftx-bam/reads.bam.bai",
    "/verification/assets/fixtures/pre-matrix/all.bed",
    "/verification/assets/fixtures/pre-matrix/input-bcf.source.vcf",
    "/verification/assets/fixtures/pre-matrix/input.bcf",
    "/verification/assets/fixtures/pre-matrix/input.bcf.csi",
    "/verification/assets/fixtures/pre-matrix/reference.fa",
    "/verification/assets/fixtures/pre-matrix/reference.fa.fai",
]

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "hap"
path = "rust/src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.5.53", features = ["derive"] }
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
noodles-bgzf = "0.46.0"

[dev-dependencies]
proptest = "1.9.0"
serde_json = "1.0.145"
syn = { version = "2.0.111", features = ["full", "visit"] }
tempfile = "3.23.0"

[features]
fuzzing = []

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
