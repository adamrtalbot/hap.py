name: dependency-policy

on:
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "THIRD_PARTY_LICENSES/**"
      - "scripts/check-notices.py"
      - "scripts/check-compression-backends.py"
      - ".github/workflows/dependency-policy.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "THIRD_PARTY_LICENSES/**"
      - "scripts/check-notices.py"
      - "scripts/check-compression-backends.py"
      - ".github/workflows/dependency-policy.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-07

      - name: Install pinned policy tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2

      - name: Enforce vulnerability, license, source, and duplicate policy
        run: |
          cargo audit --deny warnings
          cargo deny check
          python3 scripts/check-compression-backends.py

      - name: Verify packaged third-party notices
        run: python3 scripts/check-notices.py
