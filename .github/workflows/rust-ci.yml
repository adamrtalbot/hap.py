name: rust-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-07
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release binary
        run: cargo build --locked --release --bin hap

      - name: Verify single-binary package installation
        run: tests/package_smoke.sh

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned 2026-08-07
        with:
          toolchain: nightly-2026-08-07

      - name: Install cargo-fuzz
        run: cargo install --locked --version 0.13.1 cargo-fuzz

      - name: Run bounded parser fuzz smoke
        run: tests/fuzz_smoke.sh 1000

      - name: Upload fuzz reproducers on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-fuzz-reproducers
          path: fuzz/artifacts
          if-no-files-found: ignore

  msrv:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Rust 1.89.0
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0

      - name: Check the declared minimum Rust version
        run: cargo check --locked --all-targets --all-features

  nextflow-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAP_BIN: ${{ github.workspace }}/target/release/hap
      NXF_SYNTAX_PARSER: v2
      NXF_DISABLE_CHECK_LATEST: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-07

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: 26.04.6

      - name: Set up nf-test
        uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with:
          version: 0.9.5

      - name: Verify pinned evaluation toolchain
        run: |
          nextflow -version | grep 'version 26.04.6'
          nf-test version | grep 'nf-test 0.9.5'

      - name: Build release binary
        run: |
          cargo build --locked --release --bin hap
          echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Validate and format-check Nextflow
        run: |
          nextflow run verification/main.nf -preview
          nextflow lint -format -harshil-alignment . -exclude tests -exclude nf-test.config

      - name: Run complete parity gate
        working-directory: verification
        run: nf-test test --ci --coverage

      - name: Upload parity evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextflow-parity-output
          path: |
            verification/.nf-test.log
            verification/.nf-test/tests/*/meta
            verification/.nf-test/tests/*/output
