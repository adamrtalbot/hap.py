name: rust-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release --bin hap

      - name: Verify single-binary package installation
        run: tests/package_smoke.sh

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Run bounded parser fuzz smoke
        run: tests/fuzz_smoke.sh 1000

      - name: Upload fuzz reproducers on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fuzz-reproducers
          path: fuzz/artifacts
          if-no-files-found: ignore

  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Check the declared minimum Rust version
        run: cargo check --locked --all-targets

  nextflow-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAP_BIN: ${{ github.workspace }}/target/release/hap
      NXF_SYNTAX_PARSER: v2
      NXF_DISABLE_CHECK_LATEST: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install indexed-VCF query tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bcftools tabix

      - name: Install pinned Nextflow and nf-test
        env:
          NXF_VER: 26.04.6
        run: |
          mkdir -p "$RUNNER_TEMP/hap-tools"
          cd "$RUNNER_TEMP/hap-tools"
          curl -fsSL https://get.nextflow.io | bash
          curl -fsSL https://get.nf-test.com | bash -s 0.9.5
          chmod 0755 nextflow nf-test
          echo "$RUNNER_TEMP/hap-tools" >> "$GITHUB_PATH"

      - name: Verify pinned evaluation toolchain
        run: |
          nextflow -version | grep 'version 26.04.6'
          nf-test version | grep 'nf-test 0.9.5'

      - name: Build release binary
        run: |
          cargo build --locked --release --bin hap
          echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Validate and format-check Nextflow
        run: |
          nextflow run verification/main.nf -preview
          nextflow lint -format -harshil-alignment . -exclude tests -exclude nf-test.config

      - name: Run complete parity gate
        working-directory: verification
        run: nf-test test --ci --coverage

      - name: Upload parity evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-parity-output
          path: |
            verification/.nf-test.log
            verification/.nf-test/tests/*/meta
            verification/.nf-test/tests/*/output
